# Sonda temporal: comprueba que Actions ejecuta en esta rama y que se pueden leer los resultados.
name: sonda
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Versiones y red
        run: |
          set -x
          rustc --version; cargo --version; node --version || true
          curl -s -o /dev/null -m 10 -w "crates.io index: %{http_code}\n" https://index.crates.io/config.json
          LONG=$(python3 -c "print('X'*7000)")
          echo "::notice title=sonda-corta::linea1%0Alinea2%0Aok"
          echo "::notice title=sonda-larga::${LONG}"
